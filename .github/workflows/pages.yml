name: 페이지 배포

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 화면 빌드는 외부 접속이 없으므로 클라우드 러너로 충분하다.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      # 수집 결과 JSON 은 빌드 산출물 옆에 그대로 올린다.
      - name: 데이터 복사
        run: cp -r data dist/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
